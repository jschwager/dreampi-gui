{% include "header.html" %}

		<div class="container-sm">
			<div class="mt-4 mb-4">
				<h5><i class="bi bi-speedometer2 me-2"></i>Dashboard</h5>
			</div>

			<div class="row">
				<div class="col-md-4 mb-4">
					<div class="card rounded-3 h-100">
						<div class="card-header">
							<h6 class="mb-0">DreamPi Service Status</h6>
						</div>
						<div class="card-body">
    						{{ status | safe }}
						</div>
					</div>
				</div>
				<div class="col-md-4 mb-4">
					<div class="card rounded-3 h-100">
						<div class="card-header">
							<h6 class="mb-0">Modem Status</h6>
						</div>
						<div class="card-body">
    						{{ modem_name | safe }}
						</div>
					</div>
				</div>
				<div class="col-md-4 mb-4">
					<div class="card rounded-3 h-100">
						<div class="card-header">
							<h6 class="mb-0">IP Addresses</h6>
						</div>
						<div class="card-body small">
							<strong>DreamPi:</strong> {{ ip_address }}<br>
							<strong>Dreamcast:</strong> {{ dc_ip_address }}
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-md-6 mb-4">
					<div class="card rounded-3 h-100">
						<div class="card-header">
							<h6 class="mb-0">System Overview</h6>
						</div>
						<div class="card-body">
							<div class="mb-3">
								<p class="mb-2"><strong>Hostname:</strong> {{ hostname }}</p>
								<p class="mb-2"><strong>Uptime:</strong> {{ uptime }}</p>
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-sm btn-warning">Restart Service</button>
								<button class="btn btn-sm btn-danger">Stop Service</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

{% include "footer.html" %}
