<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DreamPi GUI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>
<body>
	<div class="container-sm">
		<nav class="navbar navbar-light bg-light p-3 mb-3">
			<a class="navbar-brand" href="#">
				<img src="{{ url_for('static', filename='logo.png') }}" width="30" height="30"
					class="d-inline-block align-top" alt="" />
				DreamPi GUI
			</a>
		</nav>

		<div class="container-sm">
		  <form method="POST" action="/run">
			<div class="mb-3">
			  <label for="action" class="form-label">Action</label>
			  <select class="form-select" id="action" name="action" required>
				<option value="">Select…</option>
				<option value="status">Check status</option>
				<option value="restart">Restart service</option>
			  </select>
			</div>

			<button type="submit" class="btn btn-primary">Run</button>
		  </form>

		  {% if result %}
		  <div class="mt-4">
			<h5>Result</h5>
			<pre class="bg-light p-3">{{ result }}</pre>
		  </div>
		  {% endif %}
		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
