<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DreamPi</title>
	<link rel="shortcut icon" href="/favicon.ico" type="image/vnd.microsoft.icon" />
	<link rel="icon" href="/favicon.ico" type="image/vnd.microsoft.icon" />
	<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
	<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon-180x180.png') }}">
	<link rel="apple-touch-icon" sizes="167x167" href="{{ url_for('static', filename='apple-touch-icon-167x167.png') }}">
	<link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='apple-touch-icon-152x152.png') }}">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="DreamPi">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		#ios-install-banner {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 1055;
			background: #212529;
			color: #fff;
			padding: 12px 16px;
			display: flex;
			align-items: center;
			gap: 12px;
			font-size: 0.875rem;
			box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
		}
		#ios-install-banner .banner-icon {
			font-size: 1.5rem;
			flex-shrink: 0;
		}
		#ios-install-banner .banner-text { flex: 1; }
		#ios-install-banner .banner-close {
			background: none;
			border: none;
			color: #adb5bd;
			font-size: 1.25rem;
			line-height: 1;
			padding: 0;
			cursor: pointer;
			flex-shrink: 0;
		}
	</style>
</head>
<body>
	<!-- iOS Add to Home Screen banner -->
	<div id="ios-install-banner" style="display:none;" role="complementary" aria-label="Install app">
		<div class="banner-icon"><i class="bi bi-phone"></i></div>
		<div class="banner-text">
			Install DreamPi: tap <strong><i class="bi bi-box-arrow-up"></i> Share</strong> then <strong>Add to Home Screen</strong>.
		</div>
		<button class="banner-close" id="ios-banner-close" aria-label="Dismiss">&times;</button>
	</div>

	<div class="container-fluid bg-light">
		<nav class="navbar navbar-expand-md navbar-light p-3 mb-3 mx-auto" style="max-width: 900px;">
			<div class="container-fluid px-0">
				<a class="navbar-brand" href="#">
					<img src="{{ url_for('static', filename='logo.png') }}" width="30" height="30"
						class="d-inline-block align-top" alt="" />
					DreamPi
				</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
					aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNav">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item">
							<a class="nav-link" href="/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/troubleshoot"><i class="bi bi-tools me-2"></i>Troubleshoot</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/logs"><i class="bi bi-file-text me-2"></i>Logs</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</div>
	<div class="container-sm" style="max-width: 900px;">
